<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>XM Cloud Comparison</title>
</head>
<body>
  <header class="toolbar">
    <div class="selector">
      <select id="left-connection" aria-label="Left XM Cloud connection"></select>
      <select id="left-language" aria-label="Left content language"></select>
    </div>
    <div class="toolbar-actions">
      <div class="toolbar-buttons">
        <button id="swap" class="swap" type="button" title="Swap left and right selections" aria-label="Swap selections">⇄</button>
        <button id="refresh-all" class="swap" type="button" title="Refresh the complete loaded comparison" aria-label="Refresh all loaded comparison data">↻</button>
      </div>
    </div>
    <div class="selector">
      <select id="right-connection" aria-label="Right XM Cloud connection"></select>
      <select id="right-language" aria-label="Right content language"></select>
    </div>
  </header>
  <main id="workspace" class="workspace" aria-live="polite"></main>
  <script src="{{scriptUri}}"></script>
</body>
</html>
