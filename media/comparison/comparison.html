<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src {{cspSource}}; script-src {{cspSource}};">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>XM Cloud Comparison</title>
</head>
<body>
  <header class="toolbar">
    <div class="selector">
      <select id="left-connection" aria-label="Left XM Cloud connection"></select>
      <select id="left-language" aria-label="Left content language"></select>
    </div>
    <div class="toolbar-actions">
      <div class="toolbar-buttons">
        <button id="swap" class="swap" type="button" title="Swap left and right selections" aria-label="Swap selections">⇄</button>
      </div>
      <label class="language-lock" title="Keep both comparison sides on the same configured language">
        <input id="language-lock" type="checkbox">
        <span>Lock languages</span>
      </label>
    </div>
    <div class="selector">
      <select id="right-connection" aria-label="Right XM Cloud connection"></select>
      <select id="right-language" aria-label="Right content language"></select>
    </div>
    <div id="language-switch-status" class="language-switch-status language-switch-left" role="status" hidden>
      <span id="language-switch-text"></span>
      <button id="language-switch-retry" type="button" hidden>Retry</button>
    </div>
    <div id="language-switch-status-right" class="language-switch-status language-switch-right" role="status" hidden>
      <span id="language-switch-text-right"></span>
      <button id="language-switch-retry-right" type="button" hidden>Retry</button>
    </div>
  </header>
  <main id="workspace" class="workspace" aria-live="polite"></main>
  <script src="{{scriptUri}}"></script>
</body>
</html>
