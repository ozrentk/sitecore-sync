name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node.js 24
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension and tests
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run extension-host tests
        run: npm run test:integration

      - name: Build VSIX
        run: npm run package

      - name: Upload installable VSIX
        uses: actions/upload-artifact@v7
        with:
          path: dist/sitecore-xm-cloud-sync.vsix
          if-no-files-found: error
          retention-days: 14
          archive: false
